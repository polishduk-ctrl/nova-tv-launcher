name: Build NOVA APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners ship the Android SDK; this makes sure licences/paths are set.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk NOVA-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-launcher-apk
          path: NOVA-launcher.apk

      # A single rolling release so the newest APK always lives at the same download link.
      - name: Publish "latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nova-latest --cleanup-tag --yes || true
          gh release create nova-latest NOVA-launcher.apk \
            --target "$GITHUB_SHA" \
            --title "NOVA latest build (#${GITHUB_RUN_NUMBER})" \
            --notes "Automatic build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download NOVA-launcher.apk and install it on your TV." \
            --latest
